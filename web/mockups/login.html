<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lamund — Masuk</title>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .box{width:100%;max-width:400px}
  .head{text-align:center;margin-bottom:26px}
  .head .mk{width:52px;height:52px;border-radius:14px;overflow:hidden;margin:0 auto 16px;background:var(--tint);box-shadow:0 0 0 1px var(--line),0 12px 30px -14px rgba(77,48,149,.5);display:flex;align-items:center;justify-content:center}
  .head .mk img{width:100%;height:100%;object-fit:contain}
  .head h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:26px;letter-spacing:-.5px}
  .head p{color:var(--muted);font-size:13.5px;margin-top:4px}
  .head p .live{display:inline-flex;align-items:center;gap:6px}
  .panel{padding:26px 24px 22px}
  .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
  .row a{color:var(--purple);font-size:12.5px;font-weight:600}
  .row a:hover{color:var(--purple-d)}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:18px}
  .foot b{color:var(--slate);font-family:"IBM Plex Mono",monospace;font-weight:500}
</style>
</head>
<body>
<div class="wrap">
  <div class="box">
    <div class="head">
      <div class="mk"><img src="img/lamun-logo.png" alt="Lamun"></div>
      <h1>Masuk ke Lamund</h1>
      <p>Kelola situs &amp; server di satu tempat</p>
    </div>

    <div class="card panel">
      <div class="field">
        <label for="e">Email</label>
        <div class="input">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 6h18v12H3z"/><path d="M3 7l9 6 9-6"/></svg>
          <input id="e" type="email" placeholder="kamu@contoh.com" value="rani@studio.dev">
        </div>
      </div>
      <div class="field" style="margin-bottom:20px">
        <div class="row"><label for="p" style="margin:0">Kata sandi</label><a href="#">Lupa sandi?</a></div>
        <div class="input">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          <input id="p" type="password" placeholder="Masukkan kata sandi" value="passwordku">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="cursor:pointer"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </div>
      </div>
      <button class="btn pri block">Masuk</button>
    </div>

    <div class="foot">Server ini dikelola oleh <b>lamund v0.1</b></div>
  </div>
</div>
</body>
</html>
